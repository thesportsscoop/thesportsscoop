backend:
  name: git-gateway
  branch: main # Branch to deploy from

media_folder: "src/assets/uploads" # Where media files will be stored relative to the project root
public_folder: "/assets/uploads"    # The public path for media files, relative to the site root

collections:
  - name: "news"
    label: "News Posts"
    folder: "src/news"
    create: true
    slug: "{{slug}}" # Generates a slug from the title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }

      # Adds layout: post.njk automatically in the front matter
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }

      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "string" }

      # Make category a single string
      - { label: "Category", name: "category", widget: "select", options: ["general-news", "transfers", "betting-tips", "football", "other"], multiple: false, required: false }

      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Site Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "src/about.njk"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Contact Page"
        name: "contact"
        file: "src/contact.njk"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Terms of Use Page"
        name: "terms_of_use"
        file: "src/terms-of-use.njk"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last Updated", name: "last_updated", widget: "datetime", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Privacy Policy Page"
        name: "privacy_policy"
        file: "src/privacy-policy.njk"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last Updated", name: "last_updated", widget: "datetime", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
